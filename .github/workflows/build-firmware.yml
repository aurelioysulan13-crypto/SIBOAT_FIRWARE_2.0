name: Build SIBOAT Firmware (Main ESP32 + ESP32-CAM)

on:
  push:
    branches:
      - main
    paths:
      - "firmware/**"
      - "siboat_inferencing.zip"
      - ".github/workflows/build-firmware.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siboat-firmware-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: main
            name: Main ESP32
            fqbn: esp32:esp32:esp32
            source_dir: firmware/main/SIBOAT_MAIN-ESP32_FIRMWARE_FINAL_BOSS
            sketch: SIBOAT_MAIN-ESP32_FIRMWARE_FINAL_BOSS.ino
            version_macro: FW_VERSION
            artifact: SIBOAT_main_ESP32_FIRMWARE

          - id: cam
            name: ESP32-CAM
            fqbn: esp32:esp32:esp32cam
            source_dir: firmware/cam/SIBOAT_ESP32-CAM_FIRMWARE_FINAL_BOSS
            sketch: SIBOAT_ESP32-CAM_FIRMWARE_FINAL_BOSS.ino
            version_macro: CAM_FW_VERSION
            artifact: SIBOAT_ESP32_CAM_FIRMWARE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Verify repository layout
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking required repository files..."

          test -f "${{ matrix.source_dir }}/${{ matrix.sketch }}"
          test -f "${{ matrix.source_dir }}/siboat_secrets.example.h"

          if [[ "${{ matrix.id }}" == "main" ]]; then
            test -f "${{ matrix.source_dir }}/siboat_main_types.h"
          fi

          if [[ "${{ matrix.id }}" == "cam" ]]; then
            test -f "siboat_inferencing.zip"
            test -s "siboat_inferencing.zip"
          fi

          echo "Repository layout check: PASS"

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1

      - name: Show Arduino CLI version
        run: |
          arduino-cli version

      - name: Configure Arduino CLI
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            "https://espressif.github.io/arduino-esp32/package_esp32_index.json"

          arduino-cli core update-index

      - name: Install ESP32 Arduino core 3.3.5
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli core install esp32:esp32@3.3.5

          echo "Installed cores:"
          arduino-cli core list

      - name: Prepare firmware secrets
        shell: bash
        env:
          SIBOAT_SECRETS_H: ${{ secrets.SIBOAT_SECRETS_H }}
        run: |
          set -euo pipefail

          SECRET_FILE="${{ matrix.source_dir }}/siboat_secrets.h"

          if [[ -n "${SIBOAT_SECRETS_H:-}" ]]; then
            printf '%s\n' "$SIBOAT_SECRETS_H" > "$SECRET_FILE"
            echo "Using repository secret: SIBOAT_SECRETS_H"
          else
            cp "${{ matrix.source_dir }}/siboat_secrets.example.h" "$SECRET_FILE"
            echo "WARNING: SIBOAT_SECRETS_H is not configured."
            echo "The example secrets file will be used."
            echo "The firmware may compile, but real Wi-Fi/BLE credentials will not be embedded."
          fi

          test -s "$SECRET_FILE"

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail

          SECRET_FILE="${{ matrix.source_dir }}/siboat_secrets.h"

          required_defines=(
            "SIBOAT_SSID1"
            "SIBOAT_PASS1"
            "SIBOAT_SSID2"
            "SIBOAT_PASS2"
            "SIBOAT_SSID3"
            "SIBOAT_PASS3"
            "SIBOAT_BLE_PIN"
          )

          for symbol in "${required_defines[@]}"; do
            if ! grep -Eq "^[[:space:]]*#define[[:space:]]+${symbol}([[:space:]]|$)" "$SECRET_FILE"; then
              echo "ERROR: Required definition is missing: ${symbol}"
              exit 1
            fi
          done

          echo "Required secret definitions: PASS"

      - name: Validate firmware source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="${{ matrix.source_dir }}/${{ matrix.sketch }}"

          echo "Checking firmware source:"
          echo "$SOURCE"

          test -s "$SOURCE"

          if [[ "${{ matrix.id }}" == "main" ]]; then
            grep -q "ArduinoOTA.begin" "$SOURCE"
            grep -q "ArduinoOTA.handle" "$SOURCE"
          fi

          if [[ "${{ matrix.id }}" == "cam" ]]; then
            grep -q "siboat_inferencing.h" "$SOURCE"
            grep -q "ArduinoOTA.begin" "$SOURCE"
            grep -q "ArduinoOTA.handle" "$SOURCE"
          fi

          echo "Firmware source validation: PASS"

      - name: Validate Edge Impulse library
        if: matrix.id == 'cam'
        shell: bash
        run: |
          set -euo pipefail

          test -f "siboat_inferencing.zip"
          test -s "siboat_inferencing.zip"

          mkdir -p "$RUNNER_TEMP/siboat_inferencing"

          unzip -q "siboat_inferencing.zip" \
            -d "$RUNNER_TEMP/siboat_inferencing"

          echo "Checking extracted Edge Impulse library..."

          find "$RUNNER_TEMP/siboat_inferencing" -maxdepth 4 -type f | sort | head -200

          HEADER_FOUND="$(find "$RUNNER_TEMP/siboat_inferencing" \
            -type f \
            -name "siboat_inferencing.h" \
            | head -n 1)"

          if [[ -z "$HEADER_FOUND" ]]; then
            echo "ERROR: siboat_inferencing.h was not found inside siboat_inferencing.zip"
            exit 1
          fi

          LIBRARY_PROPERTIES="$(find "$RUNNER_TEMP/siboat_inferencing" \
            -type f \
            -name "library.properties" \
            | head -n 1)"

          if [[ -z "$LIBRARY_PROPERTIES" ]]; then
            echo "ERROR: library.properties was not found inside siboat_inferencing.zip"
            exit 1
          fi

          echo "Edge Impulse header:"
          echo "$HEADER_FOUND"

          echo "library.properties:"
          echo "$LIBRARY_PROPERTIES"

          echo "Edge Impulse library validation: PASS"

      - name: Install Edge Impulse Arduino library
        if: matrix.id == 'cam'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/Arduino/libraries"

          unzip -q "siboat_inferencing.zip" \
            -d "$HOME/Arduino/libraries"

          echo "Installed Arduino libraries:"
          find "$HOME/Arduino/libraries" -maxdepth 2 -type f \
            -name "library.properties" \
            -print

      - name: Extract firmware version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="${{ matrix.source_dir }}/${{ matrix.sketch }}"
          MACRO="${{ matrix.version_macro }}"

          VERSION="$(
            grep -E "^[[:space:]]*#define[[:space:]]+${MACRO}[[:space:]]+" "$SOURCE" \
            | head -n 1 \
            | sed -E 's/.*#define[[:space:]]+'"$MACRO"'[[:space:]]+["]?([^"[:space:]]+)["]?.*/\1/'
          )"

          if [[ -z "$VERSION" ]]; then
            echo "ERROR: Could not extract firmware version using ${MACRO}"
            exit 1
          fi

          VERSION="${VERSION//\//-}"
          VERSION="${VERSION// /-}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Detected firmware version: $VERSION"

      - name: Build firmware
        id: build
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="${{ matrix.source_dir }}"
          SKETCH="${SOURCE_DIR}/${{ matrix.sketch }}"

          BUILD_ROOT="$RUNNER_TEMP/siboat-build-${{ matrix.id }}"
          BUILD_DIR="$BUILD_ROOT/build"

          mkdir -p "$BUILD_ROOT"
          mkdir -p "$BUILD_DIR"

          echo "Source directory: $SOURCE_DIR"
          echo "Sketch: $SKETCH"

          build_ok="false"
          selected_partition=""

          for partition in min_spiffs huge_app; do
            echo ""
            echo "============================================================"
            echo "Attempting partition scheme: $partition"
            echo "============================================================"

            rm -rf "$BUILD_DIR"
            mkdir -p "$BUILD_DIR"

            set +e

            arduino-cli compile \
              --fqbn "${{ matrix.fqbn }}:PartitionScheme=${partition}" \
              --build-path "$BUILD_DIR" \
              --clean \
              --warnings all \
              --export-binaries \
              "$SKETCH"

            status=$?

            set -e

            if [[ "$status" -eq 0 ]]; then
              echo "Build succeeded with partition scheme: $partition"

              build_ok="true"
              selected_partition="$partition"

              break
            fi

            echo "Build failed with partition scheme: $partition"
          done

          if [[ "$build_ok" != "true" ]]; then
            echo "ERROR: Firmware compilation failed for all supported partition schemes."
            exit 1
          fi

          echo "partition=$selected_partition" >> "$GITHUB_OUTPUT"
          echo "build_dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Selected partition scheme: $selected_partition"

      - name: Verify generated binaries
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR="${{ steps.build.outputs.build_dir }}"

          echo "Build directory:"
          find "$BUILD_DIR" -maxdepth 3 -type f -printf '%p\n' | sort

          APP_BIN="$(find "$BUILD_DIR" -maxdepth 1 -type f -name "*.ino.bin" | head -n 1)"

          if [[ -z "$APP_BIN" ]]; then
            echo "ERROR: Application .bin was not generated."
            exit 1
          fi

          echo "Application binary:"
          echo "$APP_BIN"

          test -s "$APP_BIN"

          BOOTLOADER_BIN="$(
            find "$BUILD_DIR" -type f \
              \( -name "bootloader.bin" -o -name "*bootloader*.bin" \) \
              | head -n 1
          )"

          PARTITIONS_BIN="$(
            find "$BUILD_DIR" -type f \
              \( -name "partitions.bin" -o -name "*partitions*.bin" \) \
              | head -n 1
          )"

          if [[ -z "$BOOTLOADER_BIN" ]]; then
            echo "ERROR: bootloader.bin was not generated."
            exit 1
          fi

          if [[ -z "$PARTITIONS_BIN" ]]; then
            echo "ERROR: partitions.bin was not generated."
            exit 1
          fi

          test -s "$BOOTLOADER_BIN"
          test -s "$PARTITIONS_BIN"

          echo "Application binary validation: PASS"
          echo "Bootloader binary validation: PASS"
          echo "Partitions binary validation: PASS"

      - name: Prepare release package
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR="${{ steps.build.outputs.build_dir }}"
          VERSION="${{ steps.version.outputs.version }}"
          PARTITION="${{ steps.build.outputs.partition }}"

          PACKAGE_ROOT="$RUNNER_TEMP/package"
          PACKAGE_DIR="$PACKAGE_ROOT/${{ matrix.artifact }}_${VERSION}"

          rm -rf "$PACKAGE_ROOT"
          mkdir -p "$PACKAGE_DIR"

          APP_BIN="$(
            find "$BUILD_DIR" -maxdepth 1 -type f \
              -name "*.ino.bin" \
              | head -n 1
          )"

          BOOTLOADER_BIN="$(
            find "$BUILD_DIR" -type f \
              \( -name "bootloader.bin" -o -name "*bootloader*.bin" \) \
              | head -n 1
          )"

          PARTITIONS_BIN="$(
            find "$BUILD_DIR" -type f \
              \( -name "partitions.bin" -o -name "*partitions*.bin" \) \
              | head -n 1
          )"

          CPUS_BIN="$(
            find "$BUILD_DIR" -type f \
              \( -name "boot_app0.bin" -o -name "boot_app0*.bin" \) \
              | head -n 1
          )"

          cp "$APP_BIN" "$PACKAGE_DIR/firmware.bin"
          cp "$BOOTLOADER_BIN" "$PACKAGE_DIR/bootloader.bin"
          cp "$PARTITIONS_BIN" "$PACKAGE_DIR/partitions.bin"

          if [[ -n "$CPUS_BIN" ]]; then
            cp "$CPUS_BIN" "$PACKAGE_DIR/boot_app0.bin"
          fi

          if [[ "$PARTITION" == "huge_app" ]]; then
            OTA_AVAILABLE="NO"
          else
            OTA_AVAILABLE="YES"
          fi

          if [[ -f "$PACKAGE_DIR/boot_app0.bin" ]]; then
            cat > "$PACKAGE_DIR/FLASH_INSTRUCTIONS.txt" <<FLASH_EOF
SIBOAT FIRMWARE FLASHING INSTRUCTIONS
=====================================

Board:
${{ matrix.name }}

Firmware version:
${VERSION}

Partition scheme:
${PARTITION}

OTA available:
${OTA_AVAILABLE}

FIRST USB FLASH
---------------

Use the merged all-in-one binary when available.

Flash address:
0x0

After flashing, erase/reset the board as appropriate for the board and verify startup.

IMPORTANT:
The all-in-one binary is intended for initial/full USB flashing.

OTA UPDATE
----------

OTA should use the normal application firmware.bin only.

Do NOT use the merged all-in-one binary for OTA.

OTA availability:
${OTA_AVAILABLE}

Files included:
- firmware.bin
- bootloader.bin
- partitions.bin
- boot_app0.bin
- SHA256SUMS.txt
- BUILD_REPORT.txt

IMPORTANT
---------

Do not commit a real siboat_secrets.h file into the repository.

Repository builds should obtain credentials from the GitHub Actions secret:

SIBOAT_SECRETS_H

If the repository secret is not configured, the workflow uses the example secrets header and warns that real credentials are not embedded.
FLASH_EOF
          else
            cat > "$PACKAGE_DIR/FLASH_INSTRUCTIONS.txt" <<FLASH_EOF
SIBOAT FIRMWARE FLASHING INSTRUCTIONS
=====================================

Board:
${{ matrix.name }}

Firmware version:
${VERSION}

Partition scheme:
${PARTITION}

OTA available:
${OTA_AVAILABLE}

FIRST USB FLASH
---------------

Flash the generated application/bootloader/partition binaries using the offsets supplied by the Arduino/ESP32 build output.

Do not use the application firmware.bin as an all-in-one image.

OTA UPDATE
----------

OTA availability:
${OTA_AVAILABLE}

If OTA is supported for this partition scheme, use firmware.bin only for OTA.

IMPORTANT
---------

Do not commit a real siboat_secrets.h file into the repository.

Repository builds should obtain credentials from:

SIBOAT_SECRETS_H
FLASH_EOF
          fi

          cat > "$PACKAGE_DIR/BUILD_REPORT.txt" <<REPORT_EOF
SIBOAT FIRMWARE BUILD REPORT
============================

Board: ${{ matrix.name }}
FQBN: ${{ matrix.fqbn }}
Firmware version: ${VERSION}
Partition scheme: ${PARTITION}

OTA available: ${OTA_AVAILABLE}

Arduino CLI: 1.5.1
ESP32 Arduino core: 3.3.5

Source:
${{ matrix.source_dir }}/${{ matrix.sketch }}

Build status:
SUCCESS

Firmware source was not modified by this workflow.
REPORT_EOF

          cp "$PACKAGE_DIR/BUILD_REPORT.txt" "$PACKAGE_DIR/../BUILD_REPORT.txt"

          echo "Package prepared:"
          find "$PACKAGE_DIR" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Create merged all-in-one image
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR="${{ steps.build.outputs.build_dir }}"
          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE_DIR="$RUNNER_TEMP/package/${{ matrix.artifact }}_${VERSION}"

          BOOTLOADER_BIN="$(
            find "$BUILD_DIR" -type f \
              \( -name "bootloader.bin" -o -name "*bootloader*.bin" \) \
              | head -n 1
          )"

          PARTITIONS_BIN="$(
            find "$BUILD_DIR" -type f \
              \( -name "partitions.bin" -o -name "*partitions*.bin" \) \
              | head -n 1
          )"

          APP_BIN="$(
            find "$BUILD_DIR" -maxdepth 1 -type f \
              -name "*.ino.bin" \
              | head -n 1
          )"

          BOOT_APP0_BIN="$(
            find "$BUILD_DIR" -type f \
              \( -name "boot_app0.bin" -o -name "boot_app0*.bin" \) \
              | head -n 1
          )"

          if [[ -z "$BOOT_APP0_BIN" ]]; then
            echo "boot_app0.bin was not found."
            echo "Skipping merged all-in-one image."
            exit 0
          fi

          MERGED="$PACKAGE_DIR/${{ matrix.artifact }}_${VERSION}_ALL-IN-ONE_flash_at_0x0.bin"

          arduino-cli \
            --additional-urls "https://espressif.github.io/arduino-esp32/package_esp32_index.json" \
            compile \
            --fqbn "${{ matrix.fqbn }}:PartitionScheme=${{ steps.build.outputs.partition }}" \
            --export-binaries \
            "${{ matrix.source_dir }}/${{ matrix.sketch }}" \
            >/dev/null

          ESPTOOL="$(
            find "$HOME/.arduino15/packages/esp32/tools/esptool_py" \
              -type f \
              \( -name "esptool.py" -o -name "esptool" \) \
              | sort -V \
              | tail -n 1
          )"

          if [[ -z "$ESPTOOL" ]]; then
            echo "ERROR: esptool was not found."
            exit 1
          fi

          python3 "$ESPTOOL" \
            --chip esp32 \
            merge_bin \
            -o "$MERGED" \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size detect \
            0x1000 "$BOOTLOADER_BIN" \
            0x8000 "$PARTITIONS_BIN" \
            0xe000 "$BOOT_APP0_BIN" \
            0x10000 "$APP_BIN"

          test -s "$MERGED"

          echo "Merged all-in-one image created:"
          echo "$MERGED"

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE_DIR="$RUNNER_TEMP/package/${{ matrix.artifact }}_${VERSION}"

          (
            cd "$PACKAGE_DIR"
            sha256sum *.bin > SHA256SUMS.txt
          )

          echo "SHA256 checksums:"
          cat "$PACKAGE_DIR/SHA256SUMS.txt"

      - name: Create board flash package ZIP
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE_ROOT="$RUNNER_TEMP/package"
          PACKAGE_DIR="$PACKAGE_ROOT/${{ matrix.artifact }}_${VERSION}"

          cd "$PACKAGE_ROOT"

          zip -qr \
            "${{ matrix.artifact }}_${VERSION}_FLASH_PACKAGE.zip" \
            "$(basename "$PACKAGE_DIR")"

          test -s "${{ matrix.artifact }}_${VERSION}_FLASH_PACKAGE.zip"

          echo "Flash package:"
          ls -lh "${{ matrix.artifact }}_${VERSION}_FLASH_PACKAGE.zip"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}_${{ steps.version.outputs.version }}
          path: |
            ${{ steps.build.outputs.build_dir }}/*.bin
            ${{ runner.temp }}/package/${{ matrix.artifact }}_${{ steps.version.outputs.version }}/**
          if-no-files-found: error
          retention-days: 30
